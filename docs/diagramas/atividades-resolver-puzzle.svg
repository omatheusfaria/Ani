l="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.5352" x="31" y="336.2246">Faz uma tentativa</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.7813" y2="573.3145"/><rect fill="#F1F1F1" height="34.5195" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.5762" x="346.0586" y="172.0801"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.5762" x="356.0586" y="193.7051">Abre o puzzle e apresenta seus elementos</text><rect fill="#F1F1F1" height="34.5195" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="126.1191" x="303.7769" y="384.1191"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.1191" x="313.7769" y="405.7441">Verifica a tentativa</text><rect fill="#F1F1F1" height="49.0391" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.9219" x="449.896" y="314.5996"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.9219" x="459.896" y="336.2246">Fecha o puzzle e o devolve ao estado inicial,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.752" x="459.896" y="350.7441">sem salvar progresso parcial</text><ellipse cx="586.8569" cy="409.6387" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="586.8569" cy="409.6387" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="476.8467,226.5996,488.8467,238.5996,476.8467,250.5996,464.8467,238.5996,476.8467,226.5996" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="429.6079,440.6387,524.0854,440.6387,536.0854,452.6387,524.0854,464.6387,429.6079,464.6387,417.6079,452.6387,429.6079,440.6387" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="18.106" x="480.8467" y="475.2949">sim</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.4775" x="429.6079" y="456.6401">Tentativa correta?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2715" x="536.0854" y="449.9854">n&#227;o</text><rect fill="#F1F1F1" height="49.0391" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.0137" x="733.8179" y="329.0996"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.0137" x="743.8179" y="350.7246">Indica que a tentativa n&#227;o resolveu o puzzle,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.3281" x="743.8179" y="365.2441">sem puni&#231;&#227;o sist&#234;mica</text><rect fill="#F1F1F1" height="34.5195" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212" x="370.8467" y="496.7949"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192" x="380.8467" y="518.4199">Registra o puzzle como conclu&#237;do</text><ellipse cx="476.8467" cy="562.3145" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="476.8467" cy="562.3145" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="297.7769" x2="297.7769" y1="50.7813" y2="573.3145"/><line style="stroke:#000000;stroke-width:1.5;" x1="1010.8315" x2="1010.8315" y1="50.7813" y2="573.3145"/><line style="stroke:#181818;stroke-width:1;" x1="191.2778" x2="191.2778" y1="97.5605" y2="117.5605"/><polygon fill="#181818" points="187.2778,107.5605,191.2778,117.5605,195.2778,107.5605,191.2778,111.5605" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="141.5244" x2="81.2676" y1="282.5996" y2="282.5996"/><line style="stroke:#181818;stroke-width:1;" x1="81.2